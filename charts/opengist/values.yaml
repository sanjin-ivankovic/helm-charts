## Default values for OpenGist

## @section Image parameters

## @param image.repository The Docker repository to pull the image from.
## @param image.tag The image tag to use, pinned by digest (tag@sha256:...).
## @param image.pullPolicy The logic of image pulling.
##
image:
  repository: ghcr.io/thomiceli/opengist
  tag: "1.15.3@sha256:f5dd39cc9409b4006f8b090e5f9ed042cdb736d28a06b4f985c674dacafc94d5"
  pullPolicy: IfNotPresent

## @param nameOverride String to partially override the chart name.
## @param fullnameOverride String to fully override the resource names.
##
nameOverride: ""
fullnameOverride: ""

## @section Deployment parameters

## @param replicaCount The number of replicas to deploy. Keep 1: the gist repositories and search index live on one ReadWriteOnce volume.
## @param updateStrategy The update strategy for the deployment. Recreate while the data volume is ReadWriteOnce.
## @param priorityClassName Priority class assigned to the pod.
##
replicaCount: 1
updateStrategy:
  type: Recreate
priorityClassName: ""

## @section Pod spec parameters

## @param resources Resource requests and limits for the container.
## @param nodeSelector Node selector for pod placement.
## @param affinity Pod affinity configuration.
## @param tolerations Pod tolerations configuration.
## @param topologySpreadConstraints Topology spread constraints for pod distribution.
##
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []

## @section Security parameters

## @param podSecurityContext Pod-level security context. The image entrypoint only runs its usermod/chown step when started as root; started non-root it execs OpenGist directly with HOME=/opengist, so any uid works and fsGroup makes the volume writable.
## @param securityContext Container-level security context. Every write (git repositories, .gitconfig, index, sessions) goes to the data volume or /tmp, so the root filesystem stays read-only.
##
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## @section Service parameters

## @param service.type The Kubernetes service type.
## @param service.port The service port.
## @param service.targetPort The container port to target (OpenGist HTTP).
##
service:
  type: ClusterIP
  port: 80
  targetPort: 6157

## @section Storage parameters

## @param persistence.enabled Enable the data PVC.
## @param persistence.storageClass Storage class for the PVC (empty string = use cluster default).
## @param persistence.mountPath Container path where the data volume is mounted (OpenGist home).
## @param persistence.size Size of the data volume.
## @param persistence.accessModes Access modes for the data volume.
##
# OpenGist keeps every gist as a bare git repository here, plus the search
# index and sessions (and the SQLite database unless OG_DB_URI points at
# PostgreSQL or MySQL).
persistence:
  enabled: true
  storageClass: ""
  mountPath: /opengist
  size: 2Gi
  accessModes:
    - ReadWriteOnce

## @section Environment variables

## @param env Non-secret environment variables passed to the container (OG_* names).
##
# The built-in SSH git server would listen on 2222, which the Service does not
# expose. OG_EXTERNAL_URL (the public URL used in links and API responses)
# belongs in the consumer's values.
env:
  OG_SSH_GIT_ENABLED: "disabled"
  OG_LOG_OUTPUT: "stdout"

## @section Secret parameters

## @param existingSecret Name of an existing secret whose keys are exposed as environment variables. Set OG_SECRET_KEY there: without it OpenGist generates a new key on every start, which logs everyone out. OG_DB_URI goes there too when an external database is used.
##
existingSecret: ""

## @section Health Probe parameters

## @param probes.liveness Liveness probe configuration.
## @param probes.readiness Readiness probe configuration.
##
# /healthcheck answers once the database is reachable; the first start runs
# migrations, hence the generous readiness threshold.
probes:
  liveness:
    enabled: true
    httpGetPath: /healthcheck
    initialDelaySeconds: 15
    periodSeconds: 30
    failureThreshold: 5
    timeoutSeconds: 5
  readiness:
    enabled: true
    httpGetPath: /healthcheck
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 12
    timeoutSeconds: 5
