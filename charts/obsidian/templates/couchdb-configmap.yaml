{{- if .Values.couchdb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obsidian.couchdb.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
    app.kubernetes.io/component: couchdb
data:
  20-livesync.ini: |
    {{- if .Values.couchdb.config.livesync }}
    [couchdb]
    single_node = true
    max_document_size = 50000000

    [cluster]
    n = 1

    [chttpd]
    require_valid_user = true
    require_valid_user_except_for_up = true
    max_http_request_size = 4294967296
    enable_cors = true

    [chttpd_auth]
    require_valid_user = true
    authentication_redirect = /_utils/session.html

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    credentials = true
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE
    max_age = 3600
    {{- end }}
    {{- with .Values.couchdb.config.extraIni }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
