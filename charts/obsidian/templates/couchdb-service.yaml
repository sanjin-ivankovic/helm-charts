{{- if .Values.couchdb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obsidian.couchdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
    app.kubernetes.io/component: couchdb
spec:
  type: {{ .Values.couchdb.service.type }}
  selector:
    {{- include "obsidian.couchdb.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.couchdb.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
