## Default values for Memos

## @section Image parameters

## @param image.repository The Docker repository to pull the image from.
## @param image.tag The image tag to use.
## @param image.pullPolicy The logic of image pulling.
##
image:
  repository: neosmemo/memos
  tag: "26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034"
  pullPolicy: IfNotPresent

## @section Deployment parameters

## @param replicaCount The number of replicas to deploy.
## @param updateStrategy The update strategy for the deployment.
## @param priorityClassName Priority class assigned to the pod.
##
# Memos keeps local assets (uploads, avatars) on a single ReadWriteOnce volume,
# so it runs as one replica with Recreate (never two pods contending for the
# same PVC). Scale-out requires an external database and object storage.
replicaCount: 1
updateStrategy:
  type: Recreate
priorityClassName: ""

## @section Service link parameters

## @param enableServiceLinks Whether Kubernetes injects service-discovery env vars into the pod.
##
# MUST stay false: Kubernetes injects a service-discovery var named
# <SERVICE>_PORT (e.g. MEMOS_PORT=tcp://10.x.x.x:5230) for every Service in the
# namespace. Memos reads MEMOS_PORT as its HTTP listen port, fails to parse the
# injected tcp:// URL, and falls back to listening on port 0 (a random port).
# Disabling service links stops the injection; an explicit env.MEMOS_PORT below
# is the second layer of defence.
enableServiceLinks: false

## @section Pod spec parameters

## @param resources If specified, it sets the resource requests and limits for the pod.
## @param nodeSelector Node selector for pod placement.
## @param affinity Pod affinity configuration.
## @param tolerations Pod tolerations configuration.
## @param topologySpreadConstraints Topology spread constraints for pod distribution.
## @param podSecurityContext Pod-level security context. Run directly as the image's baked-in nonroot user (uid/gid 10001). The entrypoint only runs `chown` + `su-exec` when it starts as root (id 0); starting as 10001 skips that branch entirely, so no SETUID/SETGID capability is needed and the pod is true non-root. The image chowns /var/opt/memos to 10001 at build time; fsGroup 10001 makes the mounted PVC group-writable.
## @param securityContext Container-level security context. readOnlyRootFilesystem is false because Memos writes local assets under /var/opt/memos (Trivy KSV-0014). All capabilities are dropped — none are needed once the pod runs as 10001 (no privilege step-down).
##
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## @section Service parameters

## @param service.type The Kubernetes service type.
## @param service.port The service port.
## @param service.targetPort The container port to target.
##
service:
  type: ClusterIP
  port: 80
  targetPort: 5230

## @section Storage parameters

## @param persistence.enabled Enable persistent volume claims.
## @param persistence.storageClass Storage class for the PVC (empty string = use cluster default).
## @param persistence.mountPath Container path where the data volume is mounted.
## @param persistence.size Size of the data volume.
## @param persistence.accessModes Access modes for the data volume.
##
# Memos stores local assets (uploads) here. With the postgres driver the memo
# content lives in PostgreSQL, so this volume only needs room for attachments.
persistence:
  enabled: true
  storageClass: ""
  mountPath: /var/opt/memos
  size: 5Gi
  accessModes:
    - ReadWriteOnce

## @section Environment variables

## @param env Non-secret environment variables passed to the container (MEMOS_* names).
##
# MEMOS_PORT MUST be set explicitly (see enableServiceLinks above). MEMOS_DRIVER
# selects the database backend (sqlite | mysql | postgres). MEMOS_DSN (the
# database connection string) is sensitive and comes from existingSecret below,
# never from here. MEMOS_INSTANCE_URL is the public-facing URL.
env:
  MEMOS_PORT: "5230"

## @section Secret parameters

## @param existingSecret Name of an existing secret holding the database connection string (MEMOS_DSN). Empty disables secret-backed DSN injection (e.g. for the sqlite driver).
## @param secretKeys.dsn Key in existingSecret for the MEMOS_DSN connection string.
##
existingSecret: ""
secretKeys:
  dsn: MEMOS_DSN

## @section Health Probe parameters

## @param probes.liveness Liveness probe configuration.
## @param probes.readiness Readiness probe configuration.
##
# Memos serves its health endpoint at /healthz once the server has booted and
# connected to the database.
probes:
  liveness:
    enabled: true
    httpGetPath: /healthz
    httpGetPort: 5230
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 5
    timeoutSeconds: 10
  readiness:
    enabled: true
    httpGetPath: /healthz
    httpGetPort: 5230
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 20
    timeoutSeconds: 10
