## Default values for PrivateBin

## @section Image parameters

## @param image.repository The Docker repository to pull the image from.
## @param image.tag The image tag to use.
## @param image.pullPolicy The logic of image pulling.
##
image:
  repository: privatebin/nginx-fpm-alpine
  tag: "2.1.1@sha256:9fbcc4d5671b974cafb55948d6fc3ab9eaf77f0c39271a50a16dd71bd4c4d3e6"
  pullPolicy: IfNotPresent

## @section Deployment parameters

## @param replicaCount The number of replicas to deploy.
## @param updateStrategy The update strategy for the deployment.
##
replicaCount: 1
# updateStrategy: If not set (null) and persistence is enabled, defaults to RollingUpdate with maxSurge: 0
# This ensures old pod terminates before new one starts (required for ReadWriteOnce PVCs)
updateStrategy: null

## @param priorityClassName Priority class assigned to the pod.
##
priorityClassName: ""

## @section Pod spec parameters

## @param resources If specified, it sets the resource requests and limits for the pod.
## @param nodeSelector Node selector for pod placement.
## @param affinity Pod affinity configuration.
## @param tolerations Pod tolerations configuration.
## @param topologySpreadConstraints Control how pods are spread across your cluster among failure-domains such as regions, zones, nodes, and other user-defined topology domains.
##
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []

## @section Security parameters

## @param podSecurityContext Security context for the pod. The image runs nginx and php-fpm as nobody (65534); www-data's gid 82 owns the data volume.
## @param containerSecurityContext Security context for the container. Read-only root filesystem, no capabilities: the server listens on unprivileged port 8080.
##
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 82
  fsGroup: 82
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## @section Service parameters

## @param service.type The Kubernetes service type.
## @param service.port The service port.
## @param service.targetPort The container port to target.
##
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

## @section Storage parameters

## @param persistence.enabled Enable persistent volume claim.
## @param persistence.storageClass Storage class for the PVC (empty string = use cluster default).
## @param persistence.size Size of the persistent volume.
## @param persistence.accessModes Access modes for the PVC.
##
persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce

## @section Environment variables

## @param env.TZ Timezone for the application.
## @param env.PHP_TZ PHP timezone setting.
##
env:
  TZ: "Europe/Berlin"
  PHP_TZ: "Europe/Berlin"

## @section Application configuration

## @param config PrivateBin conf.php content (INI). Empty keeps the image's built-in defaults
##   (no file uploads, 10 MiB size limit). When set it replaces those defaults, so it must
##   contain the [model] section: PrivateBin refuses to start without it. The image's
##   nginx and PHP accept requests up to 15 MB, so keep sizelimit at or below 10 MiB unless
##   those limits are raised too.
##
config: ""

## @section Health Probe parameters

## @param livenessProbe Liveness probe configuration.
## @param readinessProbe Readiness probe configuration.
##
livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
